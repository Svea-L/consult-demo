<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>康友健康模拟问诊</title>
<style>
/* Layout: one fixed-height phone screen (full-bleed on phones, framed on desktop); chat scrolls inside, dock pinned at bottom.
   Single light theme on purpose: every participant must see the same colours regardless of device dark mode. */
:root{
  --desk:#DCE6E2;
  --app:#F2F6F4;
  --app-top:#E2EFEA;
  --surface:#FFFFFF;
  --ink:#13302C;
  --ink-2:#3A5550;
  --muted:#566C68;
  --line:#DDE7E3;
  --chip:#EBF2EF;
  --accent:#0D6E62;
  --accent-soft:#D8ECE6;
  --accent-ink:#0A5249;
  --flow:#22302E;
  --sys:#E3EBE8;
  --warn:#9A3B34;
  /* doctor portrait tones: grey-blue and sand, each about equally far from the platform teal */
  --tone-zhang-bg:#DCE3EC; --tone-zhang-shirt:#4F6683;
  --tone-lin-bg:#EFE4D0;   --tone-lin-shirt:#8B6A3E;
  --skin:#E6C29E; --skin-shade:#D3A983; --hair:#2E3034;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.stage{height:100%;display:flex;align-items:center;justify-content:center}
.device{position:relative;width:100%;height:100%;max-width:430px;background:var(--app);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:640px) and (min-height:640px){
  .stage{padding:28px}
  .device{height:min(880px,100%);border-radius:38px;box-shadow:0 0 0 9px #FBFDFC,0 0 0 10px #C9D7D2,0 36px 80px rgba(19,48,44,.20)}
}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- start ---------- */
.start{padding:28px 24px 22px;background:linear-gradient(180deg,var(--app-top) 0%,var(--app) 46%);justify-content:space-between;gap:24px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.04em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px}
.start-main{display:flex;flex-direction:column;gap:14px}
.start-main h1{font-size:30px;line-height:1.25;letter-spacing:-.01em;margin:0;text-wrap:balance}
.start-main p{margin:0;color:var(--ink-2);font-size:16px}
.start-steps{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px}
.start-steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:15px;color:var(--ink-2)}
.start-steps b{width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:13px;color:var(--accent);font-weight:650;box-shadow:inset 0 0 0 1px var(--line)}
.start-foot{display:flex;flex-direction:column;gap:14px}
.primary-btn{min-height:52px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;letter-spacing:.06em}
.primary-btn:active{background:var(--accent-ink)}
.fine{font-size:13px;color:var(--muted);text-align:center;margin:0}
.session-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#F6EBD8;color:#72501F;font-size:12px}
.linkish{border:0;background:none;color:var(--accent);font-size:12.5px;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}

/* ---------- app bar ---------- */
.chat-screen{background:linear-gradient(180deg,var(--app-top) 0px,var(--app) 260px)}
.appbar{display:grid;grid-template-columns:44px 1fr 88px;align-items:center;min-height:58px;padding:6px 6px;background:rgba(255,255,255,.80);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);position:relative;z-index:3}
.icon-btn{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--chip)}
.icon-btn svg{width:22px;height:22px}
.appbar .back{color:var(--ink-2);cursor:default}
.appbar .back:hover{background:none}
.bar-title{text-align:center;line-height:1.3;min-width:0}
.bar-title strong{display:block;font-size:17px;font-weight:650}
.bar-title span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-actions{display:flex;justify-content:flex-end}

/* ---------- chat ---------- */
.chat{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.chat>*{flex-shrink:0} /* without this the action list (overflow:hidden) collapses to zero height inside the scrolling flex column */
.enter{animation:enter .28s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.scene{border:1px dashed #AFC6BF;border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.65;color:var(--ink-2);background:rgba(255,255,255,.55)}
.scene b{display:block;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600;margin-bottom:2px}

.doc-card{width:100%;border:0;text-align:left;color:var(--ink);background:var(--surface);border-radius:18px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(19,48,44,.05)}
.doc-card:hover{box-shadow:0 1px 2px rgba(19,48,44,.05),0 0 0 1px #C9DAD5}
.doc-top{display:flex;gap:12px;align-items:center}
.doc-card .info{min-width:0;flex:1}
.doc-card .name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.doc-card .name strong{font-size:17px}
.tag{font-size:12px;line-height:1.5;padding:1px 7px;border-radius:6px;border:1px solid #BCD3CC;color:var(--accent-ink);background:#F3F9F7}
.doc-card .where{font-size:13.5px;color:var(--muted);margin-top:2px}
.mode{font-size:12px;line-height:1.5;color:var(--accent-ink);background:var(--accent-soft);padding:1px 8px;border-radius:999px;white-space:nowrap;margin-left:auto}
.mode.human{margin-left:0}
.entry-card .doc-foot span:first-child{color:var(--ink-2)}
.req-btn{width:100%;min-height:50px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:16.5px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.req-btn svg{width:20px;height:20px}
.req-btn:active{background:var(--accent-ink)}
.focus{margin:0;font-size:14.5px;line-height:1.65;color:var(--ink-2);background:#F6FAF8;border-radius:12px;padding:9px 12px}
.doc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.doc-foot .more{display:inline-flex;align-items:center;gap:2px;color:var(--accent-ink);white-space:nowrap;flex:none}
.doc-foot svg{width:14px;height:14px}
.profile-head{display:flex;gap:14px;align-items:center}
.profile-head strong{font-size:20px;display:block;line-height:1.3}
.profile-head span{font-size:14px;color:var(--muted)}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--accent-ink)}
.verified svg{width:14px;height:14px}
.notify{position:absolute;left:10px;right:10px;top:10px;z-index:25;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.97);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(15,34,31,.18),0 0 0 1px var(--line);transform:translateY(-130%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.notify.on{transform:none}
.notify .logo{width:34px;height:34px;border-radius:10px}
.notify div{min-width:0;flex:1;line-height:1.4}
.notify b{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:500}
.notify span{display:block;font-size:14.5px}

.tsep{align-self:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding:2px 0}

/* avatars */
.av{position:relative;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:650;font-size:17px;line-height:1}
.av.sm{width:32px;height:32px;font-size:14px}
.av.lg{width:52px;height:52px;font-size:21px}
.av.zhang{background:var(--tone-zhang-bg)}
.av.lin{background:var(--tone-lin-bg)}
.av .portrait{width:100%;height:100%;display:block}
.av.platform{background:var(--accent)}
.av.platform svg{width:55%;height:55%}
.ai-tag{position:absolute;right:-5px;bottom:-3px;font-size:10.5px;font-weight:700;line-height:1;padding:3px 4px;border-radius:6px;background:var(--flow);color:#fff;box-shadow:0 0 0 2px var(--app);letter-spacing:.02em}

/* patient */
.pt{align-self:flex-end;max-width:80%;background:var(--accent);color:#fff;padding:10px 14px;border-radius:18px 18px 6px 18px;font-size:16px;line-height:1.6;word-break:break-word}

/* speaker turns (AI and doctor share one style on purpose) */
.turn{display:flex;flex-direction:column;gap:8px;max-width:94%;align-self:flex-start}
.turn-head{display:flex;align-items:center;gap:10px;padding-left:2px}
.turn-name{font-size:14.5px;font-weight:600;line-height:1.3}
.turn-sub{font-size:12.5px;color:var(--muted);line-height:1.3}
.bubble{background:var(--surface);border-radius:6px 18px 18px 18px;padding:13px 16px;font-size:16px;line-height:1.75;box-shadow:0 1px 2px rgba(19,48,44,.06);word-break:break-word}
.bubble p{margin:0}
.bubble .sec+.sec{margin-top:12px}
.bubble .h{font-weight:650;color:var(--ink)}
.bubble .h+p{margin-top:2px}
.bubble ol{margin:2px 0 0;padding-left:1.4em}
.bubble li+li{margin-top:4px}
.bubble ul{margin:2px 0 0;padding-left:1.25em}
.bubble ol.poss{padding-left:1.4em}
.bubble ol.poss>li+li{margin-top:8px}
.poss-t{font-weight:600}
.poss-l{font-size:15px;line-height:1.7;color:var(--ink-2);margin-top:2px}
.poss-l b{font-weight:650;color:var(--ink)}
.refs{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:1.4;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:4px 10px 4px 8px;margin-bottom:12px;cursor:default;user-select:none}
.refs svg{width:15px;height:15px;flex:none}
.gen{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;padding:2px 0}
.spin{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.waitbar{align-self:center;display:flex;align-items:center;gap:10px;max-width:92%;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:14px;line-height:1.5;padding:9px 16px;border-radius:16px;box-shadow:0 1px 2px rgba(19,48,44,.05)}
.flow-btn:disabled{background:#8A9794;cursor:not-allowed}
.bubble li::marker{color:var(--ink-2);font-variant-numeric:tabular-nums}
.bubble p+p{margin-top:8px}
.bubble .foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.6;color:var(--muted)}
.bubble .foot p+p{margin-top:2px}
.bubble .sig{text-align:right;color:var(--ink-2);font-size:15px;margin-top:6px}
.typing{display:inline-flex;gap:5px;padding:16px 18px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9DB3AD;animation:dot 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.caret::after{content:"";display:inline-block;width:2px;height:1.05em;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.sys{align-self:center;max-width:92%;text-align:center;background:var(--sys);color:var(--ink-2);font-size:13.5px;line-height:1.6;padding:8px 14px;border-radius:12px}

.acts{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(19,48,44,.05)}
.acts h3{font-size:13.5px;color:var(--muted);font-weight:500;margin:0;padding:13px 16px 4px}
.act{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 14px 0 16px;border:0;border-top:1px solid var(--line);background:none;font-size:16px;text-align:left;color:var(--ink)}
.act:first-of-type{border-top:0}
.act:hover:not(:disabled){background:#F5F9F8}
.act svg{width:16px;height:16px;color:#8EA39E;flex:none}
.act:disabled{color:#748682;cursor:not-allowed} /* 3.8:1 on white */
.act:disabled svg{color:#9AABA7}
.ended{align-self:center;font-size:13.5px;color:var(--ink-2);background:var(--sys);padding:8px 14px;border-radius:12px;text-align:center}
.fiction{font-size:12.5px;color:var(--muted);text-align:center;margin:4px 0 0}

/* ---------- dock ---------- */
.dock{background:rgba(255,255,255,.94);border-top:1px solid var(--line);padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));position:relative;z-index:2}
.hint{font-size:12.5px;color:var(--muted);padding:0 6px 6px;display:flex;justify-content:space-between;gap:8px}
.hint .count{font-variant-numeric:tabular-nums}
.composer{display:flex;gap:10px;align-items:flex-end}
.field{flex:1;min-width:0;background:var(--chip);border-radius:22px;padding:10px 16px;font-size:16px;line-height:1.55;min-height:44px;max-height:120px;overflow:auto;color:var(--ink);word-break:break-word}
.field.waiting{color:var(--muted)}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:0;flex:none;display:grid;place-items:center;transition:background .15s,transform .1s}
.send svg{width:20px;height:20px}
.send:active{transform:scale(.94)}
.send:disabled{background:#B7CAC5;cursor:default}
.send.ready{animation:ring 2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(13,110,98,.35)}70%{box-shadow:0 0 0 10px rgba(13,110,98,0)}100%{box-shadow:0 0 0 0 rgba(13,110,98,0)}}
.flow{display:flex;align-items:center;gap:12px;padding-top:4px}
.flow-label{font-size:11.5px;letter-spacing:.14em;color:var(--muted);writing-mode:horizontal-tb;flex:none;line-height:1.35;text-align:center;width:28px}
.flow-btn{flex:1;min-height:50px;border:0;border-radius:14px;background:var(--flow);color:#fff;font-size:16px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:8px}
.flow-btn svg{width:18px;height:18px}

/* ---------- sheet, menu, toast ---------- */
.layer{position:absolute;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:rgba(15,34,31,.40);animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 -10px 40px rgba(15,34,31,.15)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.grab{width:38px;height:5px;border-radius:3px;background:#D3DEDA;margin:8px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 4px 20px}
.sheet-head h2{font-size:18px;margin:0;line-height:1.4}
.sheet-body{overflow:auto;padding:6px 20px 8px;display:flex;flex-direction:column;gap:14px;min-height:0}
.sheet-body p{margin:0}
.sheet-actions{display:flex;gap:10px;padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px))}
.btn{flex:1;min-height:48px;border-radius:14px;font-size:16px;font-weight:600;border:1px solid #C9D7D3;background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:#E4C6C2}
.prompt{font-size:16px;color:var(--ink)}
.note{font-size:13.5px;color:var(--muted);line-height:1.6}
textarea.input{width:100%;min-height:128px;border:1px solid #C5D5D0;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.6;resize:vertical;background:#FBFDFC}
.done-msg{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:14px;font-size:15px;line-height:1.65}
.done-msg svg{width:20px;height:20px;flex:none;margin-top:2px}
.basis{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:16px}
.basis .who{display:flex;align-items:center;gap:10px}
.basis .who strong{font-size:15px;display:block;line-height:1.3}
.basis .who span{font-size:12.5px;color:var(--muted);display:block;line-height:1.3}
.basis p{font-size:15.5px;line-height:1.75}
.kv{display:grid;gap:4px;padding:14px;border:1px solid var(--line);border-radius:16px}
.kv h3{margin:0 0 4px;font-size:14px;color:var(--muted);font-weight:600}
.kv p{font-size:15.5px;line-height:1.7}
.casetext{font-size:16px;line-height:1.8;background:#F6FAF8;border-radius:14px;padding:14px 16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted);min-width:0}
.form-grid .wide{grid-column:1/-1}
.form-grid input,.form-grid select{min-height:44px;border:1px solid #C5D5D0;border-radius:12px;padding:8px 12px;font-size:16px;background:#FBFDFC;color:var(--ink);width:100%}
.err{color:var(--warn);font-size:13.5px}
.json{width:100%;min-height:150px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:#F6FAF8;resize:vertical}

.menu{position:absolute;top:58px;right:10px;z-index:15;background:var(--surface);border-radius:14px;box-shadow:0 12px 36px rgba(15,34,31,.18),0 0 0 1px var(--line);padding:6px;min-width:176px;animation:enter .16s both}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:11px 12px;border-radius:10px;font-size:15px;text-align:left;min-height:44px}
.menu button:hover{background:var(--chip)}
.menu .danger{color:var(--warn)}
.menu svg{width:18px;height:18px;color:var(--muted)}

.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,8px);background:var(--flow);color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- done ---------- */
.done{padding:28px 24px;justify-content:center;align-items:center;text-align:center;gap:16px;background:linear-gradient(180deg,var(--app-top) 0%,var(--app) 60%)}
.done .check{width:64px;height:64px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff}
.done .check svg{width:30px;height:30px}
.done h1{font-size:24px;margin:0;line-height:1.35}
.done p{margin:0;color:var(--ink-2)}
.done{position:relative}
.done-more{position:absolute;top:10px;right:10px;color:var(--muted)}
.start-actions{display:flex;flex-direction:column;gap:10px}
.start-actions .btn{flex:none;min-height:50px}
.resume-note{font-size:13px;color:var(--muted);text-align:center;margin:0}
.warnbox{background:#FBF1EF;color:#7A2F28;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.65}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="stage">
<div class="device" id="device">

function save(){
  S.updated_at = new Date().toISOString();

}

/* Entry modes:
   - assigned: the link carries pid/sid/order/d1/d2 → settings entry hidden, start page shows only the session id
     (participants on their own device must not see order or identity names); same session id resumes on reload.
   - setup: setup=1, or no parameters at all (moderator's own device) → settings entry shown; if this device holds
     an earlier session the start page offers "继续上一场" / "开始新场次" instead of silently resuming. */
const PARAMS = new URLSearchParams(location.search);
const ASSIGNED = ['pid','sid','order','d1','d2'].some(n => PARAMS.has(n));
const SETUP = PARAMS.get('setup') === '1' || !ASSIGNED;
function readConfig(){
  const p = PARAMS;
  const pid = p.get('pid') || 'PREVIEW';
  const cfg = {pid, session_id: p.get('sid') || pid + '_session01', order: p.get('order') || 'S1',
               directions:[p.get('d1') || 'XY', p.get('d2') || 'YX'], mode:'preview',
               content_version: SC.content_version, study_material_version: SC.study_material_version, build: BUILD};
  return validConfig(cfg) ? cfg : {...cfg, pid:'PREVIEW', session_id:'PREVIEW_session01', order:'S1', directions:['XY','YX']};
}
/* only the parameters actually present in the link are compared, so a link carrying just sid still resumes */
function linkConflicts(saved, cfg){
  if (!saved) return false;
  if (PARAMS.has('pid') && saved.pid !== cfg.pid) return true;
  if (PARAMS.has('order') && saved.order !== cfg.order) return true;
  if (PARAMS.has('d1') && (saved.directions || [])[0] !== cfg.directions[0]) return true;
  if (PARAMS.has('d2') && (saved.directions || [])[1] !== cfg.directions[1]) return true;
  return false;
}
function validConfig(c){
  return /^[A-Za-z0-9_-]{1,50}$/.test(c.pid) && /^[A-Za-z0-9_-]{1,80}$/.test(c.session_id) && ORDERS[c.order] && c.directions.every(d => DIRS.includes(d));
}

/* ---------- context of the current scenario ---------- */
function ctx(i = S.sc){
  const [caseId, identity] = ORDERS[S.config.order][i];
  const c = SC.cases[caseId], d = c.doctor, dir = S.config.directions[i];
  const idt = SC.identity_templates[identity];
  return {caseId, identity, c, d, dir, aiKey: dir[0], docKey: dir[1], idt, tone: TONE[caseId], script: SCRIPTS[caseId],
          aiName: tpl(idt.title, d), aiSub: tpl(idt.subtitle, d)};
}

/* ---------- logging ---------- */
function log(type, extra = {}){
  const inScenario = ['A','A_done','B'].includes(S.phase);
  const k = inScenario ? ctx() : null;
  S.events.push({
    event_id: uid('ev'), session_id: S.config.session_id, pid: S.config.pid, segment_id: S.segment_id,
    sequence_no: ++S.seq, event_time: new Date().toISOString(), order: S.config.order,
    scenario_index: k ? S.sc + 1 : null, case_id: k ? k.caseId : null, doctor_id: k ? k.d.id : null,
    identity: k ? k.identity : null, direction: k ? k.dir : null,
    phase: S.phase === 'A' || S.phase === 'A_done' ? 'stage_a' : S.phase === 'B' ? 'stage_b' : S.phase,
    source: 'prototype', event_type: type, target: extra.target ?? null, text: extra.text ?? null,
    ...(extra.data || {}),
    study_material_version: S.config.study_material_version, content_version: S.config.content_version, build: BUILD
  });
  save();
}

/* AI advice, long version (dialogue-script-v3.md §9.1): headed sections returned as HTML blocks so they can appear one by one.
   Summary / notes / urgent are shared by both readings of a case (case.advice_shared); possibilities and steps follow the reading. */
const ADVICE_HEADS = ['情况小结','可能的情况（按可能性排序）','建议做法','这段时间的注意事项','需要尽快就医的情况'];
/* Closing sentence after the last section, plain body text with no heading; identical for both identities, readings and cases.
   Pending the user's final confirmation (dialogue-script-v3.md §8.2): set to '' to remove it. */
const ADVICE_CLOSING = '以上是根据您的描述做出的初步判断，不能代替医生面诊和检查。';
function adviceBlocks(k){
  const a = k.c.advice[k.aiKey].ai, sh = k.c.advice_shared;
  const poss = a.possibilities.map(p => `<li><div class="poss-t">${esc(p.title)}（${esc(p.level)}）</div>${p.lines.map(l => `<div class="poss-l"><b>${esc(l.label)}：</b>${esc(l.text)}</div>`).join('')}</li>`).join('');
  return [
    `<p class="h">${ADVICE_HEADS[0]}</p><p>${esc(sh.summary)}</p>`,
    `<p class="h">${ADVICE_HEADS[1]}</p><ol class="poss">${poss}</ol>`,
    `<p class="h">${ADVICE_HEADS[2]}</p><ol>${a.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`,
    `<p class="h">${ADVICE_HEADS[3]}</p><ul>${sh.notes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`,
    `<p class="h">${ADVICE_HEADS[4]}</p><p>${esc(sh.urgent)}</p>`
  ].concat(ADVICE_CLOSING ? [`<p>${esc(ADVICE_CLOSING)}</p>`] : []);
}
const refChip = () => `<div class="refs">${ICON.book}<span>${esc(UI.ai_references)}</span></div>`;
function aiFoot(k){
  // one line, identical for both identities; the review fact (UI.review) stays in the 来源与审核说明 sheet
  return `<div class="foot"><p>${esc(UI.disclaimer)}</p></div>`;
}
async function renderAI(k, item, animate){
  if (item.kind === 'advice') add(`<div class="tsep">${T.ai}</div>`, animate);
  const turn = add(aiTurnShell(k), animate);
  const bubble = turn.querySelector('.bubble');
  if (item.kind === 'advice') bubble.classList.add('advice');
  if (!animate){
    bubble.innerHTML = item.kind === 'advice' ? refChip() + adviceBlocks(k).map(b => `<div class="sec">${b}</div>`).join('') + aiFoot(k)
                                              : aiParas(k, item).map(p => `<p>${esc(p)}</p>`).join('');
    return;
  }
  if (item.kind === 'advice'){
    // generation process, about 10 s in all (§9.5): two status lines (2 s + 3 s), then the reference chip and sections over about 5 s
    const [st1, st2] = UI.ai_generating;
    bubble.innerHTML = `<div class="gen"><span class="spin" aria-hidden="true"></span><span id="gen-text">${esc(st1)}</span></div>`; scrollBottom();
    await pause(2000, 1000);
    const g = bubble.querySelector('#gen-text'); if (g) g.textContent = st2;
    await pause(3000, 1000);
    bubble.innerHTML = refChip(); scrollBottom();
    await pause(500, 0);
    const blocks = adviceBlocks(k);
    for (const html of blocks){
      const sec = document.createElement('div'); sec.className = 'sec enter'; sec.innerHTML = html; bubble.append(sec);
      scrollBottom(); await pause(Math.round(4300 / blocks.length), 0);
    }
    bubble.insertAdjacentHTML('beforeend', aiFoot(k)); scrollBottom();
    return;
  }
  if (reduce){ bubble.innerHTML = aiParas(k, item).map(p => `<p>${esc(p)}</p>`).join(''); return; }
  bubble.classList.add('typing'); bubble.innerHTML = '<i></i><i></i><i></i>'; scrollBottom();
  await sleep(850);
  bubble.classList.remove('typing'); bubble.innerHTML = '';
  const paras = aiParas(k, item);
  for (const text of paras){
    const p = document.createElement('p'); p.className = 'caret'; bubble.append(p);
    const chars = Array.from(text); let i = 0;
    while (i < chars.length){ i = Math.min(chars.length, i + 2); p.textContent = chars.slice(0, i).join(''); if (i % 12 === 0) scrollBottom(); await sleep(34); }
    p.classList.remove('caret');
  }
  scrollBottom();
}

const SENDERS = ['contact-doctor','contact-ai','contact-platform','other','end-consultation'];
function renderActions(k, animate){
  const old = chat().querySelector('.acts'); if (old) old.remove();
  const ended = S.ended[S.sc];
  const rows = UI.actions.map(a => `<button type="button" class="act" data-act="${a.id}" ${ended && SENDERS.includes(a.id) ? 'disabled' : ''}><span>${esc(a.label)}</span>${ICON.chev}</button>`).join('');

  if (ended) add(`<div class="ended">${esc(UI.consultation_ended)} · 历史记录仍可查看</div>`, animate);
  add(`<p class="fiction">以上为虚构研究情境，请围绕材料进行体验。</p>`);
}

function dockComposer(item, busy){
  const k = ctx();
  const remaining = k.script.slice(S.cursor).filter(x => x.who === 'pt').length;
  const text = busy ? '对方正在回复…' : item.text;
  $('dock').innerHTML = `<div class="hint"><span>${busy ? '请先阅读回复' : '已为你准备好下一条，点击发送'}</span><span class="count">${busy ? '' : '还有 ' + remaining + ' 条'}</span></div>
    <div class="composer"><div class="field ${busy ? 'waiting' : ''}" id="field" aria-live="polite">${esc(text)}</div>
    <button type="button" class="send ${busy ? '' : 'ready'}" id="btn-send" aria-label="发送" ${busy ? 'disabled' : ''}>${ICON.send}</button></div>`;
  if (!busy) $('btn-send').addEventListener('click', send);
}
/* product action (no research-flow label): "请真人医生看看" after the AI answer (§10.2) */
function dockRequest(label, handler){
  $('dock').innerHTML = `<button type="button" class="req-btn" id="btn-flow">${ICON.doctor}<span>${esc(label)}</span></button>`;
  $('btn-flow').addEventListener('click', handler);
}
function dockFlow(label, handler, icon = ICON.next, disabled = false){
  $('dock').innerHTML = `<div class="flow"><span class="flow-label" aria-hidden="true">研究<br>流程</span><button type="button" class="flow-btn" id="btn-flow" ${disabled ? 'disabled' : ''}>${esc(label)}${icon}</button></div>`;
  if (!disabled) $('btn-flow').addEventListener('click', handler);

/* ---------- flow ---------- */
let runToken = 0;
async function advance(){
  const token = ++runToken;
  const k = ctx();
  while (true){
    if (token !== runToken) return;
    const item = k.script[S.cursor];
    if (!item){ S.phase = 'A_done'; save(); dockRequest(UI.reveal, () => confirmFlow('reveal', reveal)); return; }
    if (item.who === 'pt'){ dockComposer(item, false); scrollBottom(); return; }
    dockComposer(k.script.slice(S.cursor).find(x => x.who === 'pt') || {}, true);
    await renderAI(k, item, true);
    if (token !== runToken) return;
    S.cursor++;
    log(item.kind === 'advice' ? 'ai_advice_shown' : 'ai_message_shown', {target: item.id});
  }
}
function send(){
  const k = ctx(), item = k.script[S.cursor];
  if (!item || item.who !== 'pt') return;
  renderPatient(k, item, true);
  S.cursor++;
  log('message_send', {target: item.id, text: item.text});
  scrollBottom();
  advance();
}
/* Research-flow steps cannot be undone, so each asks once more; cancelling is logged. */
const FLOW_CONFIRM = {
  reveal: {title: UI.reveal, prompt: UI.reveal_confirm},
  next:   {title:'进入下一个问诊', prompt:'确认进入下一个问诊？当前问诊将不能返回。'},
  finish: {title:'结束演示', prompt:'确认结束演示？结束后不能返回问诊界面。'}
};
function confirmFlow(step, go){
  const c = FLOW_CONFIRM[step];
  log('flow_confirm_open', {target: step});
  let decided = false;
  openSheet(c.title, `<p class="prompt">${esc(c.prompt)}</p>`, [
    {label: UI.cancel, onClick: () => closeSheet('cancel')},
    {label: UI.confirm, cls: 'primary', onClick: () => { decided = true; closeSheet('done'); go(); }}
  ], () => { if (!decided) log('flow_cancel', {target: step}); });
}
function secondsSinceAdvice(){
  const ev = [...S.events].reverse().find(e => e.event_type === 'ai_advice_shown' && e.scenario_index === S.sc + 1);
  return ev ? Math.round((Date.now() - Date.parse(ev.event_time)) / 100) / 10 : null;
}
/* Waiting for the doctor, about 35 s (§9.6): a status bar steps through three lines (15 s, 10 s, 10 s; 1 s each with reduced motion),
   then the notification, system line and reply appear. The phase is already B, so a reload during the wait shows the reply at once. */
const DOCTOR_WAIT = [15000, 10000, 10000];
async function reveal(){
  const k = ctx(), token = ++runToken;
  const secs = secondsSinceAdvice();
  S.phase = 'B'; log('doctor_reveal', {data: {seconds_since_ai_advice: secs}});
  dockAfterReveal(true);
  const bar = add(`<div class="waitbar" role="status"><span class="spin" aria-hidden="true"></span><span></span></div>`, true);
  const label = bar.lastElementChild;
  for (let i = 0; i < DOCTOR_WAIT.length; i++){
    label.textContent = tpl(UI.doctor_waiting[i], k.d); scrollBottom();
    await pause(DOCTOR_WAIT[i], 1000);
    if (token !== runToken) return;
    if (i === 0){
      // step 1 ("正在为您接入真人医生…") ends: the doctor card and "{doctor}已接诊" appear above the status bar
      const card = joinBlock(k, true); chat().append(bar);
      markCardShown('live');
      setTimeout(() => chat().scrollTo({top: card.offsetTop - 12, behavior: reduce ? 'auto' : 'smooth'}), 30);
    }
  }
  bar.remove();
  notify(k);
  await pause(900, 300);
  if (token !== runToken) return;
  const sep = doctorBlock(k, true);
  markReplyShown('live');
  setTimeout(() => chat().scrollTo({top: sep.offsetTop - 12, behavior: reduce ? 'auto' : 'smooth'}), 30);
  dockAfterReveal();
}
function markCardShown(how){
  S.cardShown = S.cardShown || [false, false];
  if (S.cardShown[S.sc]) return;
  S.cardShown[S.sc] = true; log('doctor_card_shown', {target: how});
}
function markReplyShown(how){
  S.replyShown = S.replyShown || [false, false];
  if (S.replyShown[S.sc]) return;
  S.replyShown[S.sc] = true; log('doctor_reply_shown', {target: how});
}
function dockAfterReveal(disabled = false){
  if (S.sc === 0) dockFlow(UI.next, () => confirmFlow('next', nextScenario), ICON.next, disabled);
  else dockFlow('结束演示', () => confirmFlow('finish', finish), ICON.ok, disabled);
}
function nextScenario(){
  log('next_scenario');
  S.sc = 1; S.cursor = 0; S.phase = 'A';
  log('scenario_start');
  renderChat();
}
function finish(){
  log('walkthrough_complete');
  S.phase = 'done'; S.status = 'walkthrough_complete'; save();
  show('done');
}
function start(){
  S.status = 'in_progress'; S.phase = 'A';
  log('session_start'); log('scenario_start');

}
function renderChat(){
  show('chat');
  runToken++;
  chat().innerHTML = '';
  const k = ctx();
  header(k);
  k.script.slice(0, S.cursor).forEach(item => item.who === 'pt' ? renderPatient(k, item, false) : renderAI(k, item, false));
  if (S.phase === 'B'){ joinBlock(k, false); markCardShown('restore'); doctorBlock(k, false); markReplyShown('restore'); dockAfterReveal(); requestAnimationFrame(() => chat().scrollTop = chat().scrollHeight); return; }
  requestAnimationFrame(() => chat().scrollTop = chat().scrollHeight);

}

      const f = [...$('sheet').querySelectorAll('button,textarea,input,select,[tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent);
      if (!f.length) return; const first = f[0], last = f[f.length - 1];

/* ---------- boot ---------- */
function resume(){
  if (S.phase === 'done'){ show('done'); return; }
  log('restore', {target: S.phase});
  renderChat(); toast('已恢复到刚才的位置');
}
$('brand-name').textContent = SC.platform;
const cfg = readConfig();
if (ASSIGNED){
  // assigned link: the same session id on this device is restored (reload recovery) — but only when every session
  // parameter the link carries (pid, order, d1, d2) matches that record. On a mismatch the old record is moved to an
  // archive key and a new session starts from the link; nothing is shown to the participant (order and directions stay hidden).
  let saved = load(cfg.session_id);
  if (saved && saved.schema_version === '1.0' && linkConflicts(saved.config, cfg)){
    const archiveKey = `kangyou-consult-archive:${cfg.session_id}:${new Date().toISOString()}`;
    try { localStorage.setItem(archiveKey, JSON.stringify(saved)); } catch(e) {}
    S = freshState({...cfg, replaced_segment_id: saved.segment_id, archived_record_key: archiveKey});
    log('session_replaced', {data: {archived_key: archiveKey, previous_config: {pid: saved.config.pid, order: saved.config.order, directions: saved.config.directions}}});
    saved = null;
  } else S = saved && saved.schema_version === '1.0' ? saved : freshState(cfg);
  if (S.phase === 'start') show('start'); else resume();
} else {
  // no parameters: never resume silently; offer the earlier session on the start page
  S = freshState(cfg);
  let last = null; try { last = localStorage.getItem(KEY_LAST); } catch(e) {}
  const prev = last ? load(last) : null;
  pendingResume = prev && prev.schema_version === '1.0' && validConfig(prev.config) ? prev : null;
  show('start');
}
})();
</script>
